# Self-host ClockFence: app (Nginx + PHP-FPM), queue worker, scheduler and MySQL.
# Put it behind a reverse proxy with HTTPS: phones only allow GPS and camera on HTTPS.

x-app: &app
    build: .
    image: clockfence:local
    restart: unless-stopped
    env_file: .env
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: ${DB_DATABASE:-clockfence}
        DB_USERNAME: ${DB_USERNAME:-clockfence}
        DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        QUEUE_CONNECTION: database
    volumes:
        - storage:/var/www/html/storage/app
    depends_on:
        mysql:
            condition: service_healthy

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-8000}:8080'

    queue:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'queue:work', '--tries=3']
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-clockfence}
            DB_USERNAME: ${DB_USERNAME:-clockfence}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            QUEUE_CONNECTION: database
            AUTORUN_ENABLED: 'false'
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s

    scheduler:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-clockfence}
            DB_USERNAME: ${DB_USERNAME:-clockfence}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            QUEUE_CONNECTION: database
            AUTORUN_ENABLED: 'false'
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-clockfence}
            MYSQL_USER: ${DB_USERNAME:-clockfence}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-p${DB_PASSWORD}',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    storage:
    mysql:
